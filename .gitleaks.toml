# Konfigurasi gitleaks -- lihat docs/SECRETS_ROTATION.md.
# Pakai default rule set gitleaks; extend cuma buat noise yang udah ketahuan
# dari repo lama (kalau ada, tambahin allowlist path di sini pas ketemu).
title = "cti-platform gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
  '''\.venv-legacy/''',
]
# `tests/fixtures/` SENGAJA tidak di-allowlist (Fase 10.D): isinya halaman publik
# pihak ketiga yang penuh string mirip-secret (key front-end, ID AWS di artikel
# berita), dan allowlist bikin gate ini buta buat rekaman baru. Rekaman baru yang
# kena temuan di-scrub dulu: tools/ops/scrub_fixtures.py (alurnya di docstring-nya).
