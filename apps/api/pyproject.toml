[project]
name = "cti-api"
version = "0.1.0"
description = "FastAPI -- REST API (auth, artikel, CVE, IOC, dst), port dari ScraperNewsWeb"
requires-python = ">=3.12"
dependencies = [
    "cti-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-docx>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cti_api"]
