[project]
name = "cti-worker"
version = "0.1.0"
description = "Celery worker -- eksekusi scraper terjadwal + enrichment artikel"
requires-python = ">=3.12"
dependencies = [
    "cti-core",
    "cti-scraper",
    "cti-scrapers",
    "cti-enrich",
    "cti-alerts",
    "celery[redis]>=5.4",
]

# worker-nlp (Docker image, Fase 9/10) yang install extra ini -- worker
# scrape biasa gak butuh torch/spacy sama sekali. Sama pola persis
# cti-enrich's nlp extra (lihat pyproject.toml situ).
[project.optional-dependencies]
nlp = ["cti-enrich[nlp]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cti_worker"]
