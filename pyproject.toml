[project]
name = "cti-platform"
version = "0.1.0"
description = "CTI platform monorepo — scrapers, enrichment, API and web"
requires-python = ">=3.12"
dependencies = [
    "cti-core",
    "cti-scraper",
    "cti-enrich",
    "cti-alerts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "testcontainers[postgres]>=4.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
# apps/api dan apps/worker masuk workspace pas Fase 6/7 nulis kode beneran di
# sana (sekarang direktori kosong -- uv gagal resolve member tanpa pyproject.toml).
members = ["packages/*"]

[tool.uv.sources]
cti-core = { workspace = true }
cti-scraper = { workspace = true }
cti-enrich = { workspace = true }
cti-alerts = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:cti_.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
